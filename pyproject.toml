[project]
name = "chunk-size-paper"
version = "0.1.0"
description = "When chunk size is a schedule and when it is a model: equivalence test, classification and consequences"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7.0",
    "numpy",
    "einops",
    "pandas",
    "openpyxl",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = [
    "modal>=1.6.4",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
